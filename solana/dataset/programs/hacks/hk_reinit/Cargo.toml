[package]
name = "hk-reinit"
version = "0.1.0"
description = "Reinitialization attacks (port de El-Merovingio/solana-hacks)"
edition = "2021"

[dependencies]
solana-program = "2.1"            # PORT: 1.15.2 -> 2.1 (mesma linha do SSP)
borsh = { version = "1.5", features = ["derive"] }   # PORT: 0.9.3 -> 1.5
arrayref = "0.3.6"

[lib]
crate-type = ["cdylib", "lib"]
name = "hk_reinit"

[features]
no-entrypoint = []
